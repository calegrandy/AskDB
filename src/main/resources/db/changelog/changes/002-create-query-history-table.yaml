databaseChangeLog:
  - changeSet:
      id: 002-create-query-history-table
      author: calegrandy
      changes:
        - createTable:
            tableName: query_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Nullable: history is kept when its connection is deleted
              - column:
                  name: connection_id
                  type: BIGINT
              - column:
                  name: question
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: answer
                  type: TEXT
              - column:
                  name: final_sql
                  type: TEXT
              - column:
                  name: row_count
                  type: INTEGER
              # Every query the model tried: its SQL and either the row count or the error
              - column:
                  name: attempts
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: model
                  type: VARCHAR(100)
              - column:
                  name: input_tokens
                  type: INTEGER
              - column:
                  name: output_tokens
                  type: INTEGER
              - column:
                  name: duration_ms
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_query_history_connection
            baseTableName: query_history
            baseColumnNames: connection_id
            referencedTableName: connection
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_query_history_connection_created
            tableName: query_history
            columns:
              - column:
                  name: connection_id
              - column:
                  name: created_at
