spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: AskDB
  docker:
    compose:
      start:
        # Always run "docker compose up": the default skips it if ANY service is running,
        # e.g. only pagila, leaving the app's own database stopped
        skip: never
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito user pool: https://cognito-idp.<region>.amazonaws.com/<user pool id>
          issuer-uri: ${COGNITO_ISSUER_URI}
  ai:
    anthropic:
      # Never put the key here: set the ANTHROPIC_API_KEY environment variable instead
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-opus-5-5
          max-tokens: 16000

askdb:
  cognito:
    # The app client whose access tokens AskDB accepts (see CognitoAccessTokenValidator)
    client-id: ${COGNITO_CLIENT_ID}
  encryption:
    # Encrypts stored connection passwords. Like the API key, never put it here: set ASKDB_ENCRYPTION_KEY
    # (generate one with: openssl rand -base64 32). Losing it makes every stored password unreadable.
    key: ${ASKDB_ENCRYPTION_KEY}
