# Project name for container and volume names, so they don't depend on the folder name
name: askdb

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connections
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Sample database (a DVD rental store) for asking questions against, and for evals
  pagila:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pagila
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAGILA_PASSWORD:-pagila}
    ports:
      - "5433:5432"
    volumes:
      - pagila-data:/var/lib/postgresql/data
      - ./docker/pagila/load-pagila.sh:/docker-entrypoint-initdb.d/load-pagila.sh:ro
    labels:
      # Not the app's own database: stop Spring Boot's Docker Compose support from connecting to it
      org.springframework.boot.ignore: true

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pagila-data:
  pgadmin-data: